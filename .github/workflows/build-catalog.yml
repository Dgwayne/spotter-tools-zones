name: Build NWS Zone Catalog

on:
  schedule:
    # Mondays 06:00 UTC. The build reads NWS's official zone shapefiles
    # (five zip downloads, under a minute) and only publishes a release
    # when the geometry actually changed, which NWS does a few times a
    # year. Unchanged weeks publish nothing, so phones download nothing.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      allow_large_diff:
        description: 'Publish even if many zones changed (only after confirming NWS really redrew them)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Get dependencies
        run: dart pub get

      # The currently published release is the baseline for the
      # unchanged check and the diff safety gate. If it can't be
      # fetched, fail rather than publish without the gate.
      - name: Fetch published catalog
        run: |
          set -euo pipefail
          mkdir -p prev
          base=https://github.com/${{ github.repository }}/releases/latest/download
          curl -fsSL --retry 4 --retry-delay 15 -o prev/manifest.json "$base/manifest.json"
          curl -fsSL --retry 4 --retry-delay 15 -o prev/zones.bin "$base/zones.bin"

      - name: Build catalog
        id: build
        run: >-
          dart run tool/build_catalog.dart --out dist/ --previous prev/
          ${{ inputs.allow_large_diff && '--allow-large-diff' || '' }}

      - name: Sanity check
        id: check
        if: steps.build.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test -s dist/zones.bin
          test -s dist/manifest.json
          ZC=$(jq -r .zone_count dist/manifest.json)
          SB=$(jq -r .size_bytes dist/manifest.json)
          echo "zone_count=$ZC size_bytes=$SB"
          test "$ZC" -gt 10000
          test "$SB" -gt 5000000
          DATE=$(date -u +%Y%m%d)
          echo "tag=catalog-${DATE}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: steps.build.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: ${{ steps.check.outputs.tag }}
          files: |
            dist/zones.bin
            dist/manifest.json
          fail_on_unmatched_files: true
          make_latest: 'true'
